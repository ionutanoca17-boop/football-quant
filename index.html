    :root {
      --bg-main: #030712;
      --bg-panel: #0b0f19;
      --bg-card: #111827;
      --border-color: rgba(255, 255, 255, 0.08);
      --border-glow: rgba(16, 185, 129, 0.4);
      --accent-green: #10b981;
      --accent-cyan: #38bdf8;
      --accent-purple: #a855f7;

      --text-muted: #9ca3af;

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
    code, .mono { font-family: 'JetBrains Mono', monospace; }

    /* Topbar moderna */
    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 32px; background: rgba(11, 15, 25, 0.8);
      backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-color);
      position: sticky; top: 0; z-index: 100;
    }
    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
    .brand-icon {
      background: linear-gradient(135deg, var(--accent-green), var(--accent-cyan));
      color: #030712; width: 40px; height: 40px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px;
    }
    .brand span strong { display: block; font-size: 15px; letter-spacing: 0.5px; }
    .brand span small { display: block; font-size: 11px; color: var(--accent-green); font-weight: 700; letter-spacing: 1px; }

    .status-badge {
      display: flex; align-items: center; gap: 8px; background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3); padding: 6px 14px; border-radius: 20px;
      font-size: 12px; font-weight: 600; color: var(--accent-green); font-family: 'JetBrains Mono', monospace;
    }
    .status-dot { width: 8px; height: 8px; background: var(--accent-green); border-radius: 50%; box-shadow: 0 0 10px var(--accent-green); animation: pulse 2s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

    /* Container principale */
    .container { max-width: 1280px; width: 100%; margin: 0 auto; padding: 32px 20px; flex: 1; }

    /* Hero */
    .hero { text-align: center; margin-bottom: 40px; }
    .eyebrow { font-size: 12px; font-weight: 700; color: var(--accent-cyan); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }
    .hero h1 { font-size: 38px; font-weight: 800; line-height: 1.2; margin-bottom: 12px; background: linear-gradient(to right, #fff, var(--text-muted)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .hero-description { color: var(--text-muted); font-size: 16px; max-width: 600px; margin: 0 auto; line-height: 1.5; }

    /* Pannelli moderni */
    .panel {
      background: var(--bg-panel); border: 1px solid var(--border-color);
      border-radius: 20px; padding: 30px; margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); transition: all 0.3s ease;
    }
    .panel:hover { border-color: rgba(255, 255, 255, 0.15); }

    .panel-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; border-bottom: 1px solid var(--border-color); padding-bottom: 16px; }
    .panel-header h2 { font-size: 20px; font-weight: 700; color: #fff; }

    /* Form e Input ultra-moderni */
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 24px; }
    .input-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; }
    .input-group input {
      width: 100%; background: var(--bg-card); border: 1px solid var(--border-color);
      color: #fff; padding: 14px 16px; border-radius: 12px; font-size: 15px; font-family: 'JetBrains Mono', monospace;
      transition: all 0.2s ease; outline: none;
    }
    .input-group input:focus { border-color: var(--accent-green); box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15); }

    /* Pulsante principale di azione */
    .btn-action {
      width: 100%; background: linear-gradient(135deg, var(--accent-green), #059669);
      color: #030712; font-weight: 800; font-size: 16px; padding: 16px; border-radius: 12px;
      border: none; cursor: pointer; transition: all 0.2s ease; text-transform: uppercase; letter-spacing: 1px;
      box-shadow: 0 4px 20px rgba(16, 185, 129, 0.3);
    }
    .btn-action:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(16, 185, 129, 0.5); }

    .results-container { display: none; margin-top: 30px; animation: fadeIn 0.4s ease; }
